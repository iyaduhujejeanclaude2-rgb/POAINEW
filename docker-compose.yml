services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poai
      POSTGRES_USER: poai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poai -d poai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://poai:${POSTGRES_PASSWORD}@db:5432/poai
      UPLOAD_DIR: /data/screenshots
    volumes:
      - screenshots:/data/screenshots
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]
volumes:
  postgres_data:
  screenshots:
networks:
  internal:
